[project]
name = "metric-integrity"
version = "1.0.0"
description = "Denominator-safe reporting: figures that carry their basis, and attribution that is refused rather than invented."
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["metrics", "reporting", "denominator", "data-integrity", "analytics"]

[project.scripts]
demo = "metric_integrity.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
