<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" role="img" aria-label="Call records are split by whether they expressed booking intent. Each rate names its denominator. Every figure carries a basis label, and only measured figures may be quoted. Attribution without a durable join is refused.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a938f"/>
    </marker>
    <marker id="arStop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b64730"/>
    </marker>
  </defs>

  <rect width="900" height="400" fill="#f4efe4"/>

  <rect x="12" y="40" width="130" height="52" rx="4" fill="#11161b"/>
  <text x="77" y="61" fill="#f4efe4" font-size="11" text-anchor="middle">34 calls</text>
  <text x="77" y="78" fill="#9da6a7" font-size="9" text-anchor="middle">the record</text>

  <!-- intent split -->
  <g fill="none" stroke="#8a938f" stroke-width="1.6" marker-end="url(#ar)">
    <path d="M142 66 H186"/>
    <path d="M142 66 V120 H186"/>
  </g>

  <rect x="186" y="40" width="180" height="52" rx="4" fill="#2e7077"/>
  <text x="276" y="61" fill="#f4efe4" font-size="11" text-anchor="middle">14 expressed booking intent</text>
  <text x="276" y="78" fill="#dff0f0" font-size="9" text-anchor="middle">the population the claim is about</text>

  <rect x="186" y="120" width="180" height="52" rx="4" fill="#c9c4b8"/>
  <text x="276" y="141" fill="#20211d" font-size="11" text-anchor="middle">20 informational</text>
  <text x="276" y="158" fill="#55524a" font-size="9" text-anchor="middle">not failures</text>

  <!-- two denominators -->
  <g fill="none" stroke="#8a938f" stroke-width="1.6" marker-end="url(#ar)">
    <path d="M366 66 H420"/>
  </g>

  <rect x="420" y="34" width="230" height="58" rx="4" fill="#11161b"/>
  <text x="535" y="55" fill="#f4efe4" font-size="11" text-anchor="middle">4 ÷ 14 = 28.6%</text>
  <text x="535" y="73" fill="#2e7077" font-size="9" text-anchor="middle">measured · safe to quote</text>
  <text x="535" y="86" fill="#9da6a7" font-size="9" text-anchor="middle">denominator: booking_intent</text>

  <rect x="420" y="104" width="230" height="58" rx="4" fill="#fbf3ee" stroke="#b64730" stroke-width="1.4"/>
  <text x="535" y="125" fill="#20211d" font-size="11" text-anchor="middle">4 ÷ 34 = 11.8%</text>
  <text x="535" y="143" fill="#b64730" font-size="9" text-anchor="middle">basis: unavailable · not quotable</text>
  <text x="535" y="156" fill="#8a6258" font-size="9" text-anchor="middle">the number that screenshots well</text>

  <g fill="none" stroke="#b64730" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arStop)">
    <path d="M276 146 H360 V133 H420"/>
  </g>

  <!-- refusals -->
  <rect x="676" y="34" width="212" height="128" rx="4" fill="#fbf3ee" stroke="#b64730" stroke-width="1.4"/>
  <text x="782" y="56" fill="#b64730" font-size="11" text-anchor="middle">REFUSED, NOT INVENTED</text>
  <text x="782" y="80" fill="#8a6258" font-size="9" text-anchor="middle">recovered revenue</text>
  <text x="782" y="96" fill="#8a6258" font-size="9" text-anchor="middle">no durable join exists</text>
  <text x="782" y="118" fill="#20211d" font-size="10" text-anchor="middle">4 × £1200 = £4,800</text>
  <text x="782" y="135" fill="#b64730" font-size="9" text-anchor="middle">modelled estimate, not measured</text>
  <text x="782" y="152" fill="#8a6258" font-size="9" text-anchor="middle">never becomes a quote</text>
  <g fill="none" stroke="#8a938f" stroke-width="1.6" marker-end="url(#ar)">
    <path d="M650 63 H676"/>
  </g>

  <!-- footer -->
  <rect x="12" y="212" width="876" height="72" rx="4" fill="#11161b"/>
  <text x="30" y="234" fill="#f4efe4" font-size="11">limitations</text>
  <text x="30" y="252" fill="#9da6a7" font-size="9">· a booking recorded later cannot be attributed to the call that prompted it, so recovered revenue is unavailable</text>
  <text x="30" y="267" fill="#9da6a7" font-size="9">· per-booking treatment value is a configured assumption, so any total derived from it is a model</text>
  <text x="30" y="282" fill="#d99b2b" font-size="9">· making the number present but unquotable beats making it absent — the asker still gets an answer</text>

  <text x="18" y="336" fill="#20211d" font-size="12">A figure is only as good as its denominator.</text>
  <text x="18" y="356" fill="#6d6a61" font-size="9">metric-integrity · sanitised extract · figures are illustrative</text>
</svg>
