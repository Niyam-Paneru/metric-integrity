<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Metric integrity diagram</title><desc id="d">Named denominator, measured basis, and supported attribution overlap to make a figure quotable.</desc>
<rect width="1200" height="520" fill="#f5f5f1"/>
<text x="58" y="64" fill="#71716a" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">METRIC INTEGRITY</text>
<text x="58" y="108" fill="#171714" font-family="Georgia,serif" font-size="35">A number earns trust by carrying its context.</text>
<circle cx="455" cy="292" r="150" fill="#e4edb0" fill-opacity=".82" stroke="#596e35" stroke-width="2"/>
<circle cx="625" cy="292" r="150" fill="#dce9de" fill-opacity=".82" stroke="#4f7555" stroke-width="2"/>
<circle cx="540" cy="385" r="150" fill="#f1d9dc" fill-opacity=".82" stroke="#a4243b" stroke-width="2"/>
<text x="385" y="244" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">named denominator</text>
<text x="695" y="244" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">measured basis</text>
<text x="540" y="452" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">supported attribution</text>
<circle cx="540" cy="326" r="55" fill="#171714"/><text x="540" y="333" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">QUOTABLE</text>
<text x="1110" y="455" text-anchor="end" fill="#71716a" font-family="Arial,sans-serif" font-size="14">missing join? say unavailable</text>
</svg>