<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Metric integrity workflow</title>
<desc id="d">Records are filtered to a named denominator, counted, labelled by basis, and checked for attribution support.</desc>
<rect width="1200" height="320" fill="#0b1020"/>
<text x="56" y="52" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">A percentage without a denominator is just a confident-looking fraction.</text>
<path d="M88 174 H1110" stroke="#273449" stroke-width="5" stroke-linecap="round"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
  <g transform="translate(115)"><circle cy="174" r="27" fill="#60a5fa"/><text y="181" font-size="18" font-weight="700">1</text><text y="224" fill="#dbeafe" font-size="14">records</text></g>
  <g transform="translate(320)"><circle cy="174" r="27" fill="#38bdf8"/><text y="181" font-size="18" font-weight="700">2</text><text y="224" fill="#dbeafe" font-size="14">name population</text></g>
  <g transform="translate(525)"><circle cy="174" r="27" fill="#22d3ee"/><text y="181" font-size="18" font-weight="700">3</text><text y="224" fill="#cffafe" font-size="14">compute</text></g>
  <g transform="translate(730)"><circle cy="174" r="27" fill="#a78bfa"/><text y="181" font-size="18" font-weight="700">4</text><text y="224" fill="#ede9fe" font-size="14">attach basis</text></g>
  <g transform="translate(935)"><circle cy="174" r="27" fill="#f59e0b"/><text y="181" font-size="18" font-weight="700">5</text><text y="224" fill="#fef3c7" font-size="14">attribution support?</text></g>
</g>
<text x="935" y="120" fill="#fb7185" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">missing join → unavailable</text>
<text x="1140" y="286" fill="#64748b" font-family="Arial,sans-serif" font-size="13" text-anchor="end">Multiplication does not upgrade an assumption into a fact.</text>
</svg>