<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Metric integrity architecture</title><desc id="d">Raw records feed a denominator choice and basis label before a figure may be published; unsupported attribution returns unavailable.</desc>
<rect width="1200" height="520" fill="#f5f5f1"/>
<text x="56" y="62" fill="#71716a" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">METRIC INTEGRITY</text>
<text x="56" y="105" fill="#171714" font-family="Georgia,serif" font-size="34">A number should carry its own footnotes.</text>

<rect x="58" y="180" width="175" height="90" rx="14" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="80" y="210" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">DATA</text>
<text x="80" y="241" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">call records</text>

<rect x="305" y="145" width="245" height="160" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="330" y="178" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">QUESTION</text>
<text x="330" y="211" fill="#171714" font-family="Georgia,serif" font-size="24">What is divided by what?</text>
<text x="330" y="248" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">all calls</text>
<text x="330" y="274" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">booking-intent calls</text>

<rect x="625" y="145" width="235" height="160" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="650" y="178" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">BASIS</text>
<text x="650" y="211" fill="#171714" font-family="Georgia,serif" font-size="24">How do we know it?</text>
<text x="650" y="248" fill="#596e35" font-family="Arial,sans-serif" font-size="14">measured</text>
<text x="730" y="248" fill="#a4243b" font-family="Arial,sans-serif" font-size="14">modelled</text>
<text x="650" y="274" fill="#71716a" font-family="Arial,sans-serif" font-size="14">unavailable</text>

<rect x="935" y="180" width="200" height="90" rx="14" fill="#e4edb0" stroke="#596e35" stroke-width="2"/>
<text x="960" y="210" fill="#596e35" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">OUTPUT</text>
<text x="960" y="241" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">labelled figure</text>

<g stroke="#171714" stroke-width="2" fill="none"><path d="M233 225 H305"/><path d="M550 225 H625"/><path d="M860 225 H935"/></g>
<g fill="#171714"><path d="M297 219 l10 6 -10 6z"/><path d="M617 219 l10 6 -10 6z"/><path d="M927 219 l10 6 -10 6z"/></g>

<rect x="305" y="365" width="555" height="70" rx="14" fill="#f1d9dc" stroke="#a4243b" stroke-width="2"/>
<text x="330" y="394" fill="#a4243b" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">ATTRIBUTION WITHOUT A JOIN</text>
<text x="330" y="420" fill="#171714" font-family="Georgia,serif" font-size="19">Return “unavailable.” Do not estimate around missing evidence.</text>
</svg>